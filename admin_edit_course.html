<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course - EduQuest</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            background: white;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            color: #6d28d9;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .back-btn {
            text-decoration: none;
            background: #f3e8ff;
            color: #6d28d9;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout {
            text-decoration: none;
            background: #ef4444;
            color: white;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 45px 6%;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .hero p {
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 45px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .form-title {
            margin-bottom: 28px;
        }

        .form-title h2 {
            color: #111827;
            margin-bottom: 6px;
        }

        .form-title p {
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.08);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            cursor: pointer;
            padding: 13px 20px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
        }

        .submit-btn {
            background: #6d28d9;
            color: white;
            flex: 1;
        }

        .submit-btn:hover {
            background: #5b21b6;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;
            flex: 1;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        footer span {
            color: #a78bfa;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 14px 5%;
            }

            .logo {
                font-size: 21px;
            }

            .back-btn {
                display: none;
            }

            .hero {
                padding: 40px 5%;
            }

            .hero h1 {
                font-size: 28px;
            }

            .container {
                width: 92%;
            }

            .form-card {
                padding: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="/admin" class="logo">
            🎓 EduQuest
        </a>

        <div class="nav-links">

            <a href="/admin/courses" class="back-btn">
                ← Courses
            </a>

            <a href="/admin/logout" class="logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- Hero -->
    <section class="hero">

        <h1>✏️ Edit Course</h1>

        <p>
            Update the course information and save your changes.
        </p>

    </section>


    <!-- Form -->
    <div class="container">

        <div class="form-card">

            <div class="form-title">

                <h2>Course Information</h2>

                <p>
                    Modify the details of this course below.
                </p>

            </div>


            <form method="POST">

                <div class="form-group">

                    <label for="title">
                        Course Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ course['title'] }}"
                        placeholder="Course title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Course Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Course description"
                        required
                    >{{ course['description'] }}</textarea>

                </div>


                <div class="form-group">

                    <label for="level">
                        Course Level
                    </label>

                    <select
                        id="level"
                        name="level"
                        required
                    >

                        <option
                            value="Beginner"
                            {% if course['level'] == 'Beginner' %}selected{% endif %}
                        >
                            Beginner
                        </option>

                        <option
                            value="Intermediate"
                            {% if course['level'] == 'Intermediate' %}selected{% endif %}
                        >
                            Intermediate
                        </option>

                        <option
                            value="Advanced"
                            {% if course['level'] == 'Advanced' %}selected{% endif %}
                        >
                            Advanced
                        </option>

                    </select>

                </div>


                <div class="buttons">

                    <a
                        href="/admin/courses"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn submit-btn"
                    >
                        ✓ Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <footer>

        © 2026 <span>EduQuest</span> — Admin Course Management

    </footer>

</body>
</html>
