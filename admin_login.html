{% extends "base.html" %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <p class="auth-label">
            EduQuest Admin
        </p>

        <h1>
            Admin Login
        </h1>

        <p class="auth-subtitle">
            Login to manage EduQuest.
        </p>

        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Admin Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>

            <button type="submit" class="auth-button">
                Login to Admin →
            </button>

        </form>

        <div class="auth-footer">

            <p>
                <a href="{{ url_for('index') }}">
                    ← Back to EduQuest
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
